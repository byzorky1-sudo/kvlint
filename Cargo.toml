[package]
name = "kvlint"
version = "0.2.0"
edition = "2021"
description = "Universal LLM prompt cache linter, token waste optimizer, and automated prefix re-architecting engine."
license = "MIT"
authors = ["byzorky1-sudo <byzorky1@users.noreply.github.com>"]
repository = "https://github.com/byzorky1-sudo/kvlint"
homepage = "https://github.com/byzorky1-sudo/kvlint"
readme = "README.md"
keywords = ["llm", "kv-cache", "optimizer", "vllm", "prompt-engineering"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
inquire = "0.7"
colored = "2.1"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.10"
