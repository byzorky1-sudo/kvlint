name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test kvlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --all-targets

      - name: Run Tests
        run: cargo test --all

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Clippy Linter
        run: cargo clippy -- -D warnings

      - name: Test Self-Scan on Examples
        run: cargo run -- scan examples/demo_prompts.md || true
