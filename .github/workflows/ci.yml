name: CI Prompt Cache Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-prompts:
    name: Lint LLM Prompts for KV-Cache Invalidation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install kvlint
        run: cargo install --path .

      - name: Run kvlint (Strict Mode)
        run: kvlint scan --strict .
